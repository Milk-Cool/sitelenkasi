<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sitelen kasi</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.ts" type="module" defer></script>
    </head>
    <body>
        <div class="block">
            <h2>vowel</h2>
            <label for="vowel-f1-in">F<small>1</small>: </label><input id="vowel-f1-in" type="range" min="300" max="850" value="800" step="10"><span id="vowel-f1-out"></span><br>
            <label for="vowel-f2-in">F<small>2</small>: </label><input id="vowel-f2-in" type="range" min="500" max="2500" value="1600" step="10"><span id="vowel-f2-out"></span><br>
            ipa: <span id="vowel-ipa"></span><br>
            <canvas width="300" height="300" id="vowel"></canvas>
        </div>
        <div class="block">
            <h2>consonant</h2>
            <label for="consonant-place1-in">place 1: </label><select id="consonant-place1-in"></select><br>
            <label for="consonant-place2-in">place 2: </label><select id="consonant-place2-in"></select><br>
            <label for="consonant-manner-in">manner: </label><select id="consonant-manner-in"></select><br>
            <label for="consonant-mod-in">modifier: </label><select id="consonant-mod-in"></select><br>
            ipa: <span id="consonant-ipa"></span><br>
            <canvas width="300" height="300" id="consonant"></canvas>
        </div>
    </body>
</html>
